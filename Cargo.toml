[package]
name = "luish"
version = "0.1.0"
edition = "2024"
description = "A POSIX shell with optional Rhai plugins"
license = "MIT"

[dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "term", "resource", "user", "dir", "poll"] }
rhai = { version = "1.26", optional = true, default-features = false, features = ["std", "no_float", "only_i64"] }
rustyline = "18.0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["plugins"]
# Rhai plugins (PLAN.md §6). Without it, `plugin load` reports an error.
plugins = ["dep:rhai"]
