[package]
name = "luish"
version = "0.1.0"
edition = "2024"
description = "A POSIX shell with optional Rhai plugins"
license = "MIT"

[dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "term", "resource", "user", "dir", "poll"] }
rustyline = "18.0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
