[package]
name = "luish"
version = "0.1.0"
edition = "2024"
description = "A POSIX shell with optional plugins and Rhai extensions"
license = "MIT"

[dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "term", "resource", "user", "dir", "poll"] }
rhai = { version = "1.26", optional = true, default-features = false, features = ["std", "only_i64"] }
rustyline = "18.0.1"
# config.toml: a small parser (no serde) that keeps the positions of keys.
toml-span = { version = "0.7.1", default-features = false }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["plugins"]
# Plugins and their Rhai extensions (DEVELOPING.md). Without it, `plugin load` reports an error.
plugins = ["dep:rhai"]
