[package]
name = "luish"
version = "0.5.0"
edition = "2024"
# The oldest Rust that builds luish (pixi.toml pins the one it is developed with).
rust-version = "1.95"
description = "A POSIX shell with optional plugins and Rhai extensions"
license = "MIT"
repository = "https://github.com/luispedro/luish"

[dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "term", "resource", "user", "dir", "poll"] }
rhai = { version = "1.26", optional = true, default-features = false, features = ["std", "only_i64"] }
rustyline = "18.0.1"
# config.toml: a small parser (no serde) that keeps the positions of keys.
toml-span = { version = "0.7.1", default-features = false }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["plugins"]
# Plugins and their Rhai extensions (DEVELOPING.md). Without it, `plugin load` reports an error.
plugins = ["dep:rhai"]

[lints.rust]
# Set by cargo-fuzz, for code that only the fuzz targets use (fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
