[workspace]
authors = ["Luis Pedro Coelho <luis@luispedro.org>"]
channels = ["conda-forge"]
name = "luish"
platforms = ["linux-64", "linux-aarch64"]
version = "0.4.0"
description = "A POSIX shell written in Rust, with optional plugins and Rhai extensions"

# dash and bash (the reference shells for the differential tests) come from
# the system: conda-forge has no dash-shell package. zsh, the reference for
# the cases marked `# reference: zsh`, is pinned here.
[dependencies]
rust = ">=1.98.1,<1.99"
zsh = "5.9.*"

[tasks]
build = "cargo build"
release = "cargo build --release"
test = "cargo test"
fmt = "cargo fmt"
fmt-check = "cargo fmt --check"
lint = "cargo clippy --all-targets -- -D warnings"
check = { depends-on = ["fmt-check", "lint", "test"] }
luish = "cargo run --quiet --"
# Script benchmarks against dash and other shells (see bench/README.md).
bench = { cmd = "sh bench/run.sh", depends-on = ["release"] }

# User documentation (docs/), published on Read the Docs, which installs from
# docs/requirements.txt: keep the two in step.
[feature.docs.dependencies]
python = "3.13.*"
sphinx = ">=8"
myst-parser = ">=4"
furo = "*"

[feature.docs.tasks]
docs = "sphinx-build -W -b html docs docs/_build/html"

# Release builds (scripts/dist.sh): linked against glibc 2.17 with conda-forge's
# sysroot, so that they run on any distribution from 2014 on, and a static musl
# build, for which dist.sh uses rustup (conda-forge has no musl Rust library).
[feature.dist.dependencies]
# To remove the rpath that conda-forge's gcc adds (scripts/dist.sh).
patchelf = "*"

[feature.dist.target.linux-64.dependencies]
gcc_linux-64 = "*"
sysroot_linux-64 = "2.17.*"

[feature.dist.target.linux-aarch64.dependencies]
gcc_linux-aarch64 = "*"
sysroot_linux-aarch64 = "2.17.*"

[feature.dist.target.linux-64.activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "x86_64-conda-linux-gnu-cc"

[feature.dist.target.linux-aarch64.activation.env]
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "aarch64-conda-linux-gnu-cc"

[feature.dist.tasks]
dist = "sh scripts/dist.sh"

[environments]
docs = { features = ["docs"], no-default-feature = true }
dist = { features = ["dist"] }
